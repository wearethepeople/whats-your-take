name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm test

  migration-check:
    name: migrations match schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: fail if schema drifted from committed migrations
        run: git diff --exit-code drizzle/

  deploy:
    name: deploy to Fly
    needs: [lint, typecheck, test, migration-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Single-machine SQLite: never let two deploys overlap.
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: harmless when the machine exists; prevents Fly's
      # two-machine default if it ever doesn't. Machine count must stay 1.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Tells IndexNow (Bing, Yandex and other participating engines) about every
  # URL in the live sitemap once the deploy is out. INDEXNOW_KEY must match
  # the key file public/<key>.txt, which proves ownership. The key is public
  # by design. Same job in wearethepeople.us, whatsyourtake.us and
  # itsourmoney.us.
  indexnow:
    name: notify IndexNow
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SITE: https://whatsyourtake.us
      INDEXNOW_KEY: 3675f536cfedb74df879b03a70a2d732
    steps:
      - name: submit sitemap URLs
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          jq -n --arg host "${SITE#https://}" --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, urlList: $urls}' \
            | curl -fsS -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @- \
                -o /dev/null -w 'IndexNow: HTTP %{http_code}\n'
